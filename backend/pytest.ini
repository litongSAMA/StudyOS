[pytest]
# 默认只跑 tests/ 下的活跃用例；tests/quarantine/ 是已隔离的失效用例（见该目录 README），
# 它们引用了本仓库不存在的模块，保留在收集范围内会让整轮测试在收集阶段直接中断。
testpaths = tests
norecursedirs = quarantine
addopts = -ra
# 任何 DeprecationWarning 一律按失败处理：防止 sqlite3 弃用的默认 datetime/date
# 适配器告警回归（db.py 已注册显式 ISO 适配器；裸绑定 datetime 不再触发弃用路径）。
filterwarnings =
    error::DeprecationWarning
